<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מאגר ספרות החלמה</title>
<meta name="description" content="ספריית חומרי החלמה ושירות בעברית — חיפוש ועיון לפי תיקיות">
<meta name="theme-color" content="#0f4f4c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── tokens ─────────────────────────────────────────── */
:root{
  --ground:#eef2ef; --surface:#ffffff; --sunk:#e3e9e5; --line:#d3dbd6;
  --ink:#16262c; --muted:#5d6f72; --faint:#8a9a9b;
  --teal:#0f4f4c; --teal-2:#1d6e69; --teal-soft:#d6e8e4;
  --amber:#d99a1c; --amber-soft:#fbecc8; --mark:#ffe08a;
  --danger:#a8432a;
  --spine-1:#0f4f4c; --spine-2:#28474f; --spine-3:#6b4e2e; --spine-4:#3c5a3a; --spine-5:#5a3f55; --spine-6:#2f3f63; --spine-7:#7a5a1e;
  --shelf:#c9d3cd; --shadow:0 1px 0 rgba(22,38,44,.04),0 8px 24px -12px rgba(22,38,44,.25);
  --serif:"Frank Ruhl Libre",Georgia,serif;
  --sans:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1719; --surface:#172225; --sunk:#1d2a2e; --line:#2a3a3e;
  --ink:#e3ece9; --muted:#9db0b0; --faint:#6f8485;
  --teal:#5bbcb2; --teal-2:#7fd0c6; --teal-soft:#1b3836;
  --amber:#f0bd4f; --amber-soft:#3a2f14; --mark:#6b5317;
  --danger:#e48a70;
  --spine-1:#1f6a65; --spine-2:#36606a; --spine-3:#86643c; --spine-4:#4e7550; --spine-5:#77577a; --spine-6:#43588a; --spine-7:#977226;
  --shelf:#2a3a3e; --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0f1719; --surface:#172225; --sunk:#1d2a2e; --line:#2a3a3e;
  --ink:#e3ece9; --muted:#9db0b0; --faint:#6f8485;
  --teal:#5bbcb2; --teal-2:#7fd0c6; --teal-soft:#1b3836;
  --amber:#f0bd4f; --amber-soft:#3a2f14; --mark:#6b5317;
  --danger:#e48a70;
  --spine-1:#1f6a65; --spine-2:#36606a; --spine-3:#86643c; --spine-4:#4e7550; --spine-5:#77577a; --spine-6:#43588a; --spine-7:#977226;
  --shelf:#2a3a3e; --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ── base ───────────────────────────────────────────── */
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* ── top bar ────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:10px;padding:14px 0}
.bar .name{font:700 17px/1 var(--serif);margin-inline-end:auto;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.bar .name i{width:12px;height:22px;border-radius:2px;background:var(--teal);box-shadow:5px 3px 0 -1px var(--amber)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on .dot{background:#2fae8c;box-shadow:0 0 0 0 rgba(47,174,140,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(47,174,140,0)}100%{box-shadow:0 0 0 0 rgba(47,174,140,0)}}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--sunk)}

/* ── hero ───────────────────────────────────────────── */
.hero{padding:28px 0 8px}
.hero h1{font:900 clamp(40px,7.4vw,92px)/.95 var(--serif);letter-spacing:-.02em;margin:0;color:var(--ink)}
.hero p{margin:14px 0 0;color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:56ch}
.search{position:relative;margin-top:26px;max-width:760px}
.search input{width:100%;height:62px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 56px 0 92px;font-size:19px;outline:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft),var(--shadow)}
.search .glass{position:absolute;inset-inline-start:20px;top:20px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;inset-inline-end:12px;top:13px;height:36px;border:0;border-radius:10px;background:var(--sunk);padding:0 12px;font-size:14px;color:var(--muted);display:none}
.search.has .clear{display:block}
.search kbd{position:absolute;inset-inline-end:16px;top:19px;font:600 13px/1 var(--sans);color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.search.has kbd{display:none}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:14px;color:var(--muted);align-items:center}
.suggest button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;color:var(--ink)}
.suggest button:hover{background:var(--surface);border-color:var(--teal)}

/* ── the shelf (one bold element) ───────────────────── */
.shelf-wrap{margin:34px 0 0;position:relative}
.shelf{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:24px 4px 0;scrollbar-width:thin;scroll-snap-type:x proximity}
.shelf::after{content:"";flex:0 0 4px}
.shelf-board{height:14px;background:var(--shelf);border-radius:3px;box-shadow:0 10px 18px -12px rgba(0,0,0,.5)}
.spine{--h:180px;--c:var(--spine-1);flex:0 0 auto;width:62px;height:var(--h);background:var(--c);color:#f4f1e6;border:0;border-radius:4px 4px 1px 1px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 10px;scroll-snap-align:start;
  background-image:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 18%,rgba(0,0,0,0) 82%,rgba(0,0,0,.18)),linear-gradient(180deg,transparent 18px,rgba(255,255,255,.22) 18px,rgba(255,255,255,.22) 20px,transparent 20px,transparent calc(100% - 34px),rgba(255,255,255,.22) calc(100% - 34px),rgba(255,255,255,.22) calc(100% - 32px),transparent calc(100% - 32px));
  transform-origin:bottom center;transition:transform .25s cubic-bezier(.3,.7,.3,1.3),box-shadow .2s}
.spine:hover{transform:translateY(-12px)}
.spine.active{transform:translateY(-18px);box-shadow:0 0 0 3px var(--amber)}
.spine .t{writing-mode:vertical-rl;font:700 15px/1.15 var(--serif);max-height:calc(var(--h) - 64px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.spine .n{font:600 12px/1 var(--sans);opacity:.85;font-variant-numeric:tabular-nums}
.spine.w2{width:74px}.spine.w3{width:86px}
.spine.lean{transform:rotate(-4deg);margin-inline-start:10px}
.spine.lean:hover{transform:rotate(-4deg) translateY(-10px)}
@media (prefers-reduced-motion:no-preference){
  .loaded .spine{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
  @keyframes rise{from{transform:translateY(40px);opacity:0}}
}

/* ── layout ─────────────────────────────────────────── */
.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;padding:40px 0 80px;align-items:start}
.tree{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-inline-end:6px;scrollbar-width:thin}
.tree h2{font:700 20px/1.2 var(--serif);margin:0 0 10px}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-inline-start:14px;border-inline-start:1px solid var(--line);margin-inline-start:13px}
.node{display:flex;align-items:center;gap:2px}
.node .tog{width:26px;height:30px;border:0;background:none;color:var(--faint);display:grid;place-items:center;border-radius:6px}
.node .tog svg{transition:transform .2s}
.node .tog[aria-expanded="true"] svg{transform:rotate(-90deg)}
.node .tog.none{visibility:hidden}
.node .lbl{flex:1;min-width:0;display:flex;gap:8px;align-items:baseline;border:0;background:none;text-align:start;padding:5px 8px;border-radius:8px;font-size:14.5px;color:var(--ink)}
.node .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .lbl em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.node .lbl:hover{background:var(--sunk)}
.node .lbl[aria-current="true"]{background:var(--teal);color:#fff}
.node .lbl[aria-current="true"] em{color:rgba(255,255,255,.75)}
.tree .all{margin-bottom:6px}

/* ── content head ───────────────────────────────────── */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px;color:var(--muted);margin-bottom:6px}
.crumbs button{border:0;background:none;padding:2px 4px;border-radius:6px;color:var(--teal)}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:var(--faint)}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font:700 clamp(28px,3.6vw,44px)/1.05 var(--serif);margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.head .count{color:var(--muted);font-size:15px;white-space:nowrap}
.drive-link{font-size:14px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--ink)}
.drive-link:hover{border-color:var(--teal)}

.subs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:6px;scrollbar-width:thin}
.sub{flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px 10px 12px;text-align:start;max-width:280px}
.sub:hover{border-color:var(--teal);background:var(--teal-soft)}
.sub b{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub small{color:var(--muted);font-size:12.5px;display:block}
.sub .fi{width:10px;height:28px;border-radius:2px;background:var(--c,var(--teal))}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;position:sticky;top:0;z-index:4;background:var(--ground);padding:10px 0;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip em{font-style:normal;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:inherit;opacity:.7}
.tools .sp{flex:1}
.tools select{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;width:36px;height:32px;display:grid;place-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.filter-btn{display:none}

/* ── section: recent ────────────────────────────────── */
.block-title{font:700 22px/1.2 var(--serif);margin:8px 0 12px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:34px}
.rcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:10px;min-height:128px;position:relative;overflow:hidden}
.rcard:hover{border-color:var(--teal)}
.rcard b{font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard small{color:var(--muted);font-size:12.5px;margin-top:auto}

/* ── file list ──────────────────────────────────────── */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:10px;text-align:start;background:none;border-inline:0;border-top:0;width:100%}
.row:hover{background:var(--surface)}
.row .nm{font-weight:500;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:3px}
.row .meta .path{color:var(--teal-2)}
.row .acts{display:flex;gap:6px;opacity:.55}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.row .acts a{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink);border:1px solid transparent}
.row .acts a:hover{border-color:var(--line);background:var(--ground)}
.glyph{width:40px;height:48px;border-radius:4px 10px 4px 4px;background:var(--g,#888);color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 10px/1 var(--sans);letter-spacing:.02em;position:relative}
.glyph::before{content:"";position:absolute;top:0;inset-inline-end:0;width:11px;height:11px;background:rgba(255,255,255,.35);border-radius:0 10px 0 4px}
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.list.grid .row{grid-template-columns:1fr;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;align-content:start;gap:10px}
.list.grid .row .acts{opacity:1}
.list.grid .glyph{width:46px;height:56px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 22px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 24px/1.2 var(--serif);color:var(--ink);margin-bottom:8px}
.lock{color:var(--danger);font-size:12px}
.folder-hits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

/* ── preview panel ──────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(760px,100vw);background:var(--surface);z-index:21;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.25)}
.panel.on{transform:none}
.panel header{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.panel h3{font:700 22px/1.25 var(--serif);margin:0;overflow-wrap:anywhere}
.panel .pmeta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.panel .pbody{flex:1;background:var(--sunk);position:relative}
.panel iframe{width:100%;height:100%;border:0;display:block;background:var(--sunk)}
.panel .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.panel footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1719}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1719}}
.btn:hover{filter:brightness(1.06)}
.panel .x{margin-inline-start:auto}

/* ── toast / footer ─────────────────────────────────── */
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:12px;font-size:14px;transition:transform .3s;z-index:30}
.toast.on{transform:translate(-50%,0)}
.foot{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13.5px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.drop{border:2px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);margin-top:20px}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}

/* ── searching: the shelf steps aside so results sit under the field ── */
.searching .shelf-wrap,.searching .suggest,.searching #lede{display:none}
.searching .hero h1{font-size:clamp(28px,3.4vw,40px)}
.searching .hero h1 br{display:none}
.searching .main{padding-top:24px}

/* ── mobile ─────────────────────────────────────────── */
@media (max-width:900px){
  .main{grid-template-columns:1fr;padding-top:28px}
  .tree{position:fixed;inset:0 auto 0 0;inset-inline-start:0;width:min(340px,88vw);max-height:none;height:100%;background:var(--surface);z-index:21;padding:20px 16px;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 50px rgba(0,0,0,.25)}
  .tree.on{transform:none}
  .filter-btn{display:inline-flex}
  .spine{width:52px}.spine.w2{width:60px}.spine.w3{width:68px}
  .spine .t{font-size:13.5px}
  .row{grid-template-columns:38px minmax(0,1fr);padding:12px 4px}
  .row .acts{grid-column:2;opacity:1}
  .glyph{width:36px;height:44px}
  .search input{height:56px;font-size:17px;padding-inline-start:50px}
  .search .glass{top:17px;inset-inline-start:16px}
  .search kbd{display:none}
  .search .clear{top:10px}
  .live .txt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="name" href="#" id="home"><i aria-hidden="true"></i>מאגר ספרות החלמה</a>
    <span class="live" id="live" title=""><span class="dot"></span><span class="txt">טוען…</span></span>
    <button class="ibtn" id="theme" aria-label="החלפת מצב תצוגה בהיר או כהה">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <section class="hero">
    <h1>מאגר ספרות <br>החלמה</h1>
    <p id="lede">ספרות, חומרי שירות, סדנאות ועזרים לקבוצות — ישירות מהתיקייה המשותפת בדרייב.</p>
    <div class="search" id="searchBox">
      <svg class="glass" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" class="sr">חיפוש במאגר</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="חיפוש לפי שם קובץ או תיקייה">
      <kbd aria-hidden="true">/</kbd>
      <button class="clear" id="clear" type="button">ניקוי</button>
    </div>
    <div class="suggest" id="suggest" hidden></div>
  </section>

  <div class="shelf-wrap" aria-label="תיקיות ראשיות">
    <div class="shelf" id="shelf" role="list"></div>
    <div class="shelf-board" aria-hidden="true"></div>
  </div>

  <div class="main">
    <nav class="tree" id="tree" aria-label="עץ תיקיות"></nav>
    <section id="content" aria-live="polite">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          פתיחת התיקייה בדרייב
        </a>
      </div>
      <div class="subs" id="subs"></div>
      <div class="tools" id="tools">
        <button class="chip filter-btn" id="openTree" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg>תיקיות
        </button>

        <span class="sp"></span>
        <label class="sr" for="sort">מיון</label>
        <select id="sort">
          <option value="rel">הכי רלוונטי</option>
          <option value="new">הכי חדש</option>
          <option value="name">לפי שם</option>
          <option value="folder">לפי תיקייה</option>
        </select>
        <div class="seg" role="group" aria-label="תצוגה">
          <button type="button" data-view="list" aria-pressed="true" aria-label="רשימה"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          <button type="button" data-view="grid" aria-pressed="false" aria-label="רשת"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        </div>
      </div>
      <div id="recentWrap"></div>
      <div class="folder-hits" id="folderHits"></div>
      <div class="list" id="list"></div>

    </section>
  </div>

  <footer class="foot">
    <span id="footStats"></span>
    <span>הקבצים נפתחים מתוך Google Drive. אפשר לשתף קישור לכל חיפוש או תיקייה — הכתובת שומרת אותם.</span>
  </footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
  <header>
    <div style="min-width:0">
      <h3 id="pTitle"></h3>

    <button class="ibtn x" id="pClose" aria-label="סגירה"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div class="pbody" id="pBody"></div>
  <footer>
    <a class="btn primary" id="pOpen" target="_blank" rel="noopener">פתיחה בדרייב</a>
    <a class="btn" id="pDown" target="_blank" rel="noopener">הורדה</a>
    <button class="btn" id="pCopy" type="button">העתקת קישור</button>
  </footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ════════════════════════════════════════════════════════════
   הגדרות
   LIVE_DATA_URL — כתובת ה-Web App של Apps Script (מסתיימת ב-/exec).
   כשהיא מוגדרת, האתר טוען את התוכן ישירות מהדרייב בכל כניסה.
   אם היא ריקה או לא זמינה — נטען הקובץ data.json שליד האתר.
   ════════════════════════════════════════════════════════════ */
const LIVE_DATA_URL = 'https://script.google.com/macros/s/AKfycbwIQU9zDWSijoxfaHqCpsPf9WuAUsOGZSrU-1doiajIfFs8WY2i8cCe_lIwkAmBsZCMjg/exec';
const FALLBACK_URL = 'data.json';
const PAGE = 60;

const TYPES = {
  pdf:    {label:'PDF',     tag:'PDF',  g:'#b4442f'},
  doc:    {label:'מסמכים',  tag:'DOC',  g:'#2f5fa8'},
  slides: {label:'מצגות',   tag:'מצגת', g:'#c0741c'},
  sheet:  {label:'גיליונות',tag:'XLS',  g:'#2d7a4a'},
  image:  {label:'תמונות',  tag:'IMG',  g:'#7a4f8c'},
  video:  {label:'וידאו',   tag:'VID',  g:'#1f6a65'},
  audio:  {label:'הקלטות',  tag:'AUD',  g:'#8a5a2b'},
  other:  {label:'אחר',     tag:'FILE', g:'#5d6f72'}
};
const SPINES = ['--spine-1','--spine-2','--spine-3','--spine-4','--spine-5','--spine-6','--spine-7'];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── normalizing ─────────────────────────────────────── */
const BIDI = /[‎‏‪-‮⁦-⁩﻿]/g;
const NIQQUD = /[֑-ׇ]/g;
const FINALS = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(s){
  return String(s||'').replace(BIDI,'').replace(NIQQUD,'').toLowerCase()
    .replace(/[ךםןףץ]/g, c => FINALS[c]).replace(/[״"׳'`]/g,'')
    .replace(/[_\-–—.,:;()\[\]{}\/\\|+]+/g,' ').replace(/\s+/g,' ').trim();
}
function cleanFolder(s){ return String(s||'').replace(BIDI,'').replace(/\s+/g,' ').trim(); }
function displayName(name){
  let s = String(name||'').replace(BIDI,'');
  s = s.replace(/\.(pdf|docx?|pptx?|xlsx?|odt|ods|odp|rtf|txt|jpe?g|png|gif|heic|webp|svg|mp4|mov|m4a|mp3|wav|mpe?g|avi|psd|zip)$/i,'');
  s = s.replace(/\s*\(\d+\)\s*$/,'').replace(/_/g,' ').replace(/\s{2,}/g,' ').trim();
  return s || String(name);
}
function typeOf(f){
  if (f.type && TYPES[f.type]) return f.type;
  const m = f.mimeType||'', n = (f.name||'').toLowerCase();
  if (m==='application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if (/document|msword|rtf|text\/plain|opendocument\.text/.test(m)) return 'doc';
  if (/presentation|powerpoint/.test(m)) return 'slides';
  if (/spreadsheet|excel|csv/.test(m)) return 'sheet';
  if (/^image\//.test(m)) return 'image';
  if (/^video\//.test(m)) return 'video';
  if (/^audio\//.test(m)) return 'audio';
  return 'other';
}
const JUNK_DIRS = new Set(['_rels','docProps','theme','word','xl','worksheets','printerSettings']);
function isJunk(f){
  const n = f.name||'';
  if (n.startsWith('~$') || n==='.DS_Store' || n==='desktop.ini') return true;
  if (/^recovery-literature\.json$/.test(n)) return true;
  if ((f.path||[]).some(p => JUNK_DIRS.has(p))) return true;
  if (/\.(xml|rels|css|html?)$/i.test(n) && /_files$|_rels|docProps/.test((f.path||[]).join('/'))) return true;
  return false;
}

/* ── state ───────────────────────────────────────────── */
let DB = null;            // {files, folders:Map, roots:[], generatedAt, live}
const S = {q:'', folder:'', type:'', sort:'rel', view:'list', shown:PAGE};

function build(raw, live){
  const folders = new Map();      // key -> {key,name,path,parent,children:Set,count,url,color}
  const mk = (path) => {
    const key = path.join('/');
    if (!folders.has(key)) {
      folders.set(key,{key,name:path[path.length-1],path,parent:path.slice(0,-1).join('/'),children:new Set(),count:0,url:null});
      if (path.length>1) mk(path.slice(0,-1)).children.add(key);
    }
    return folders.get(key);
  };
  (raw.categories||[]).forEach(c => {
    if (typeof c === 'string') return;
    const p = (c.path||[]).map(cleanFolder); if (!p.length) return;
    const node = mk(p); node.url = c.url||null;
  });
  const files = [];
  (raw.files||[]).forEach(f => {
    if (isJunk(f)) return;
    const path = (f.path||[]).map(cleanFolder);
    const t = typeOf(f);
    const name = displayName(f.name);
    const fo = {
      id:f.id, raw:f.name, name, type:t, path, key:path.join('/'),
      updated: f.updated||f.updatedAt||'', size:f.size||0,
      viewUrl:f.viewUrl||('https://drive.google.com/file/d/'+f.id+'/view'),
      downloadUrl:f.downloadUrl||('https://drive.google.com/uc?export=download&id='+f.id),
      locked: raw.version>=2 && f.shared===false,
      n: norm(name), np: norm(path.join(' '))
    };
    files.push(fo);
    for (let i=1;i<=path.length;i++) mk(path.slice(0,i)).count++;
  });
  const roots = [...folders.values()].filter(f=>f.path.length===1).sort((a,b)=>b.count-a.count);
  roots.forEach((r,i)=>r.color = SPINES[i % SPINES.length]);
  folders.forEach(f => { if (f.path.length>1) f.color = folders.get(f.path[0]).color; });
  const rootFiles = files.filter(f=>!f.path.length).length;
  return {files, folders, roots, rootFiles, generatedAt: raw.generatedAt, live, rootUrl: raw.root && raw.root.url};
}

/* ── load ────────────────────────────────────────────── */
async function load(){
  const tries = [];
  if (LIVE_DATA_URL) tries.push([LIVE_DATA_URL,true]);
  tries.push([FALLBACK_URL,false]);
  for (const [url,live] of tries){
    try{
      const r = await fetch(url, {cache:'no-store', redirect:'follow'});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      if (!j.files) throw new Error('bad');
      return start(j, live);
    }catch(e){ /* try next */ }
  }
  showDrop();
}
function start(raw, live){
  DB = build(raw, live);
  readHash();
  renderShelf(); renderTree(); renderSuggest(); setLive(); render();
  requestAnimationFrame(()=>document.body.classList.add('loaded'));
}
function setLive(){
  const el = $('#live'), when = DB.generatedAt ? new Date(DB.generatedAt) : null;
  el.classList.toggle('on', DB.live);
  const rel = when ? ago(when) : '';
  el.querySelector('.txt').textContent = DB.live ? 'מחובר לדרייב' + (rel?' · סונכרן '+rel:'') : (when ? 'עודכן ' + when.toLocaleDateString('he-IL') : '');
  el.title = when ? 'סריקה אחרונה: ' + when.toLocaleString('he-IL') : '';
  $('#q').placeholder = `חיפוש ב־${DB.files.length.toLocaleString('he-IL')} קבצים`;
  $('#footStats').textContent = `${DB.files.length.toLocaleString('he-IL')} קבצים ב־${DB.folders.size} תיקיות`;
}
function ago(d){
  const m = Math.round((Date.now()-d)/60000);
  if (m<1) return 'עכשיו'; if (m<60) return `לפני ${m} דק׳`;
  const h = Math.round(m/60); if (h<24) return h===1?'לפני שעה':`לפני ${h} שעות`;
  const dd = Math.round(h/24); return dd===1?'אתמול':`לפני ${dd} ימים`;
}

/* ── shelf ───────────────────────────────────────────── */
function renderShelf(){
  const max = Math.max(...DB.roots.map(r=>r.count),1);
  $('#shelf').innerHTML = DB.roots.map((r,i)=>{
    const h = Math.round(150 + 120*Math.sqrt(r.count/max));
    const w = r.count>120?'w3':r.count>40?'w2':'';
    const lean = i===DB.roots.length-1 && DB.roots.length>4 ? ' lean':'';
    return `<button class="spine ${w}${lean}" role="listitem" data-k="${esc(r.key)}" style="--h:${h}px;--c:var(${r.color});--i:${i}" title="${esc(r.name)} — ${r.count} קבצים" aria-label="${esc(r.name)}, ${r.count} קבצים">
      <span class="t">${esc(r.name)}</span><span class="n">${r.count}</span></button>`;
  }).join('');
}

/* ── tree ────────────────────────────────────────────── */
const OPEN = new Set();
function sortedChildren(node){ return [...node.children].map(k=>DB.folders.get(k)).sort((a,b)=>a.name.localeCompare(b.name,'he')); }
function treeNode(n){
  const kids = sortedChildren(n), open = OPEN.has(n.key);
  return `<li><div class="node">
    <button class="tog${kids.length?'':' none'}" data-tog="${esc(n.key)}" aria-expanded="${open}" aria-label="פתיחה או סגירה של ${esc(n.name)}" tabindex="${kids.length?0:-1}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="lbl" data-k="${esc(n.key)}" aria-current="${S.folder===n.key}"><span>${esc(n.name)}</span><em>${n.count}</em></button>
  </div>${kids.length && open ? `<ul>${kids.map(treeNode).join('')}</ul>`:''}</li>`;
}
function renderTree(){
  if (S.folder){ const p = S.folder.split('/'); for (let i=1;i<=p.length;i++) OPEN.add(p.slice(0,i).join('/')); }
  const roots = [...DB.roots].sort((a,b)=>a.name.localeCompare(b.name,'he'));
  $('#tree').innerHTML = `<h2>תיקיות</h2><ul>
    <li class="all"><div class="node"><span class="tog none"></span><button class="lbl" data-k="" aria-current="${S.folder===''}"><span>כל המאגר</span><em>${DB.files.length}</em></button></div></li>
    ${roots.map(treeNode).join('')}</ul>`;
}

/* ── search ──────────────────────────────────────────── */
function score(f, toks){
  let s = 0;
  for (const t of toks){
    const inN = f.n.indexOf(t), inP = f.np.indexOf(t);
    if (inN<0 && inP<0) return -1;
    if (inN===0) s += 12; else if (inN>0) s += (f.n[inN-1]===' '?9:6);
    else s += 2;
  }
  return s;
}
function highlight(text, toks){
  if (!toks.length) return esc(text);
  // map normalized positions back onto the original string, character by character
  const chars = [...text]; const map = []; let ns = '';
  chars.forEach((c,i)=>{ const n = norm(c); if (n){ for (const x of n){ ns += x; map.push(i);} } else if (/\s|[_\-–—.,:;()\/]/.test(c) && !ns.endsWith(' ')){ ns+=' '; map.push(i);} });
  const hit = new Array(chars.length).fill(false);
  toks.forEach(t=>{ let i = ns.indexOf(t); while(i>=0){ for(let k=i;k<i+t.length;k++) hit[map[k]] = true; i = ns.indexOf(t,i+t.length);} });
  let out='', on=false;
  chars.forEach((c,i)=>{ if(hit[i]&&!on){out+='<mark>';on=true;} if(!hit[i]&&on){out+='</mark>';on=false;} out+=esc(c); });
  return out + (on?'</mark>':'');
}

/* ── render ──────────────────────────────────────────── */
function current(){
  const toks = norm(S.q).split(' ').filter(Boolean);
  let pool = S.folder ? DB.files.filter(f => f.key===S.folder || f.key.startsWith(S.folder+'/')) : DB.files;
  let scored = pool.map(f=>({f, s: toks.length ? score(f,toks) : 0})).filter(x=>x.s>=0);
  const typeCounts = {}; scored.forEach(x=>typeCounts[x.f.type]=(typeCounts[x.f.type]||0)+1);
  if (S.type) scored = scored.filter(x=>x.f.type===S.type);
  const by = {
    rel:(a,b)=> toks.length ? (b.s-a.s) || a.f.name.localeCompare(b.f.name,'he') : (a.f.key.localeCompare(b.f.key,'he') || a.f.name.localeCompare(b.f.name,'he',{numeric:true})),
    new:(a,b)=> (b.f.updated||'').localeCompare(a.f.updated||''),
    name:(a,b)=> a.f.name.localeCompare(b.f.name,'he',{numeric:true}),
    folder:(a,b)=> a.f.key.localeCompare(b.f.key,'he') || a.f.name.localeCompare(b.f.name,'he',{numeric:true})
  };
  scored.sort(by[S.sort]||by.rel);
  return {toks, items: scored.map(x=>x.f), typeCounts};
}
function render(){
  if (!DB) return;
  document.body.classList.toggle('searching', !!S.q);
  const {toks, items, typeCounts} = current();
  const node = S.folder ? DB.folders.get(S.folder) : null;

  // shelf + tree highlight
  document.querySelectorAll('.spine').forEach(b=>b.classList.toggle('active', !!S.folder && (S.folder===b.dataset.k || S.folder.startsWith(b.dataset.k+'/'))));
  document.querySelectorAll('.tree .lbl').forEach(b=>b.setAttribute('aria-current', String(b.dataset.k===S.folder)));

  // crumbs + title
  const parts = node ? node.path : [];
  $('#crumbs').innerHTML = `<button data-k="">כל המאגר</button>` + parts.map((p,i)=>`<span class="sep">/</span>${i===parts.length-1?`<span>${esc(p)}</span>`:`<button data-k="${esc(parts.slice(0,i+1).join('/'))}">${esc(p)}</button>`}`).join('');
  $('#crumbs').hidden = !node;
  $('#title').textContent = S.q ? `חיפוש: ${S.q}` : (node ? node.name : 'כל המאגר');
  $('#count').textContent = `${items.length.toLocaleString('he-IL')} קבצים` + (S.q && node ? ` בתוך ${node.name}` : '');
  const dl = $('#driveLink');
  const url = node ? node.url : DB.rootUrl;
  dl.hidden = !url || !!S.q; if (url) dl.href = url;

  // subfolders
  const kids = node ? sortedChildren(node) : (S.q ? [] : []);
  $('#subs').innerHTML = (!S.q && node) ? kids.map(k=>`<button class="sub" data-k="${esc(k.key)}" style="--c:var(${k.color})"><span class="fi"></span><span style="min-width:0"><b>${esc(k.name)}</b><small>${k.count} קבצים${k.children.size?` · ${k.children.size} תיקיות`:''}</small></span></button>`).join('') : '';
  $('#subs').hidden = !$('#subs').innerHTML;

  // folder hits when searching
  if (toks.length){
    const fh = [...DB.folders.values()].filter(f => toks.every(t=>norm(f.name).includes(t)) && (!S.folder || f.key.startsWith(S.folder))).slice(0,8);
    $('#folderHits').innerHTML = fh.map(f=>`<button class="sub" data-k="${esc(f.key)}" style="--c:var(${f.color})"><span class="fi"></span><span style="min-width:0"><b>${highlight(f.name,toks)}</b><small>${esc(f.path.slice(0,-1).join(' / ')||'תיקייה ראשית')} · ${f.count} קבצים</small></span></button>`).join('');
  } else $('#folderHits').innerHTML = '';

  // types
  const order = Object.keys(TYPES).filter(t=>typeCounts[t] || S.type===t);
  $('#types').innerHTML = `<button class="chip" data-type="" aria-pressed="${!S.type}">הכול</button>` +
    order.map(t=>`<button class="chip" data-type="${t}" aria-pressed="${S.type===t}">${TYPES[t].label} <em>${typeCounts[t]||0}</em></button>`).join('');
  $('#sort').value = S.sort;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.view===S.view)));

  // recent (home only)
  if (!S.q && !S.folder && !S.type){
    const rec = [...DB.files].filter(f=>f.updated).sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,8);
    $('#recentWrap').innerHTML = rec.length ? `<h3 class="block-title">עודכנו לאחרונה</h3><div class="recent">${rec.map(f=>`
      <button class="rcard" data-id="${f.id}"><span class="glyph" style="--g:${TYPES[f.type].g}">${TYPES[f.type].tag}</span><b>${esc(f.name)}</b><small>${esc(f.path[f.path.length-1]||'כללי')} · ${fmtDate(f.updated)}</small></button>`).join('')}</div><h3 class="block-title">כל הקבצים</h3>` : '';
  } else $('#recentWrap').innerHTML = '';

  // list
  const list = $('#list');
  list.className = 'list' + (S.view==='grid'?' grid':'');
  const slice = items.slice(0, S.shown);
  const depth = node ? node.path.length : 0;
  list.innerHTML = slice.map(f=>row(f,toks,f.path.slice(depth))).join('');
  $('#more').hidden = items.length <= S.shown;
  $('#more').textContent = `עוד ${Math.min(PAGE, items.length-S.shown)} קבצים (מתוך ${items.length-S.shown} שנותרו)`;
  const em = $('#empty');
  em.hidden = items.length>0;
  if (!items.length) em.innerHTML = S.q ? `<b>לא נמצאו קבצים</b>נסו מילה אחרת או חלק ממנה${S.folder||S.type?', או <button class="chip" id="widen">חיפוש בכל המאגר</button>':''}` : `<b>התיקייה ריקה</b>אין בה קבצים כרגע.`;
  document.title = (S.q ? S.q+' — ' : node ? node.name+' — ' : '') + 'מאגר ספרות החלמה';
}
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}); }
function fmtSize(b){ if(!b) return ''; const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<3){b/=1024;i++;} return (i?b.toFixed(b<10?1:0):b)+' '+u[i]; }
function row(f,toks,rel){
  const T = TYPES[f.type];
  return `<div class="row" data-id="${f.id}" tabindex="0" role="button" aria-label="${esc(f.name)}">
    <span class="glyph" style="--g:${T.g}">${T.tag}</span>
    <div style="min-width:0"><div class="nm">${highlight(f.name,toks)}</div>
      <div class="meta">${rel.length?`<span class="path">${highlight(rel.join(' / '),toks)}</span>`:''}${f.updated?`<span>${fmtDate(f.updated)}</span>`:''}${f.size?`<span>${fmtSize(f.size)}</span>`:''}${f.locked?'<span class="lock">לא משותף</span>':''}</div></div>
    <div class="acts">
      <a href="${esc(f.viewUrl)}" target="_blank" rel="noopener" aria-label="פתיחה בדרייב" title="פתיחה בדרייב" data-stop data-act="open"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      <a href="${esc(f.downloadUrl)}" target="_blank" rel="noopener" aria-label="הורדה" title="הורדה" data-stop data-act="download"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg></a>
    </div></div>`;
}

/* ── suggestions (most populated sub-folders) ───────── */
function renderSuggest(){
  const picks = [...DB.folders.values()].filter(f=>f.path.length===2 && f.count>=6).sort((a,b)=>b.count-a.count).slice(0,6);
  if (!picks.length) return;
  $('#suggest').hidden = false;
  $('#suggest').innerHTML = `<span>מבט מהיר:</span>` + picks.map(f=>`<button data-k="${esc(f.key)}">${esc(f.name)}</button>`).join('');
}

/* ── anonymous usage stats (no names, no IPs, no cookies) ── */
let current_file = null, lastSearch = '', ts;
function track(ev, data={}){
  if (!LIVE_DATA_URL) return;
  try{
    const body = JSON.stringify(Object.assign({ev}, data));
    if (navigator.sendBeacon && navigator.sendBeacon(LIVE_DATA_URL, new Blob([body],{type:'text/plain'}))) return;
    fetch(LIVE_DATA_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body});
  }catch(_){}
}
function fileInfo(f){ return {id:f.id, name:f.name, folder:f.path.join(' / ')}; }
function trackSearchSoon(now){
  clearTimeout(ts);
  const fire = ()=>{ const q = S.q.trim(); if (q.length<2 || q===lastSearch) return; lastSearch = q; track('search',{q, results: current().items.length, folder: S.folder}); };
  now ? fire() : (ts = setTimeout(fire, 1500));
}

/* ── preview panel ───────────────────────────────────── */
let lastFocus = null;
function openFile(id){
  const f = DB.files.find(x=>x.id===id); if (!f) return;
  lastFocus = document.activeElement;
  $('#pTitle').textContent = f.name;
  $('#pMeta').innerHTML = `<span>${esc(f.path.join(' / ')||'כללי')}</span>${f.updated?`<span>עודכן ${fmtDate(f.updated)}</span>`:''}${f.size?`<span>${fmtSize(f.size)}</span>`:''}<span>${esc(f.raw)}</span>`;
  $('#pOpen').href = f.viewUrl; $('#pDown').href = f.downloadUrl;
  $('#pCopy').dataset.url = f.viewUrl;
  $('#pBody').innerHTML = `<div class="loading">טוען תצוגה מקדימה…</div><iframe title="תצוגה מקדימה: ${esc(f.name)}" src="https://drive.google.com/file/d/${encodeURIComponent(f.id)}/preview" allow="autoplay; fullscreen" loading="lazy"></iframe>`;
  const panel = $('#panel'); panel.hidden = false;
  requestAnimationFrame(()=>{ panel.classList.add('on'); $('#scrim').classList.add('on'); $('#pClose').focus(); });
  setHash({file:id}, true);
  current_file = f; track('view', fileInfo(f));
}
function closePanel(){
  const p = $('#panel'); if (p.hidden) return;
  p.classList.remove('on'); $('#scrim').classList.remove('on'); $('#tree').classList.remove('on');
  setTimeout(()=>{ p.hidden = true; $('#pBody').innerHTML=''; }, 320);
  setHash({file:null}, true);
  if (lastFocus) lastFocus.focus();
}

/* ── hash state ──────────────────────────────────────── */
let fileFromHash = null;
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  S.q = h.get('q')||''; S.folder = h.get('f')||''; S.type = h.get('t')||''; S.sort = h.get('s')||'rel';
  if (S.folder && DB && !DB.folders.has(S.folder)) S.folder = '';
  $('#q').value = S.q; $('#searchBox').classList.toggle('has', !!S.q);
  fileFromHash = h.get('file');
}
function setHash(extra={}, replace=false){
  const h = new URLSearchParams();
  if (S.q) h.set('q',S.q); if (S.folder) h.set('f',S.folder); if (S.type) h.set('t',S.type); if (S.sort!=='rel') h.set('s',S.sort);
  const cur = new URLSearchParams(location.hash.slice(1)).get('file');
  const file = 'file' in extra ? extra.file : cur;
  if (file) h.set('file',file);
  const str = h.toString(); const url = location.pathname + location.search + (str?'#'+str:'');
  replace ? history.replaceState(null,'',url) : history.pushState(null,'',url);
}
function go(changes, scroll=true){
  Object.assign(S, changes, {shown:PAGE});
  if (changes.folder) track('folder',{folder: changes.folder.split('/').join(' / ')});
  setHash({file:null});
  if ('folder' in changes) renderTree();
  render();
  $('#tree').classList.remove('on'); if ($('#panel').hidden) $('#scrim').classList.remove('on');
  if (scroll) document.querySelector('.main').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
}

/* ── events ──────────────────────────────────────────── */
let tq;
$('#q').addEventListener('input', e=>{
  $('#searchBox').classList.toggle('has', !!e.target.value);
  clearTimeout(tq); tq = setTimeout(()=>{ if (!S.q && e.target.value.trim() && S.folder){ S.folder=''; renderTree(); } S.q = e.target.value.trim(); S.shown = PAGE; if (S.q && S.sort!=='rel') S.sort='rel'; setHash({file:null},true); render(); trackSearchSoon(); }, 90);
});
$('#q').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); trackSearchSoon(true); document.querySelector('.main').scrollIntoView({behavior:'smooth'}); } });
$('#clear').addEventListener('click', ()=>{ $('#q').value=''; $('#searchBox').classList.remove('has'); go({q:''},false); $('#q').focus(); });
document.addEventListener('click', e=>{
  const k = e.target.closest('[data-k]');
  if (k && !e.target.closest('[data-stop]')){ e.preventDefault(); const key = k.dataset.k; go({folder:key, q: k.closest('#folderHits')?'':S.q}); if (k.closest('#folderHits')){ $('#q').value=''; $('#searchBox').classList.remove('has'); } return; }
  const tg = e.target.closest('[data-tog]');
  if (tg){ const key = tg.dataset.tog; OPEN.has(key)?OPEN.delete(key):OPEN.add(key); renderTree(); const b=document.querySelector(`[data-tog="${CSS.escape(key)}"]`); b&&b.focus(); return; }
  const ty = e.target.closest('[data-type]'); if (ty){ go({type:ty.dataset.type}, false); return; }
  const vw = e.target.closest('[data-view]'); if (vw){ S.view = vw.dataset.view; try{localStorage.setItem('rl-view',S.view)}catch(_){} render(); return; }
  const act = e.target.closest('[data-act]');
  if (act){ const r = act.closest('[data-id]'); const f = r && DB.files.find(x=>x.id===r.dataset.id); if (f) track(act.dataset.act, fileInfo(f)); return; }
  if (e.target.closest('[data-stop]')) return;
  const fid = e.target.closest('[data-id]'); if (fid){ openFile(fid.dataset.id); return; }
  if (e.target.id==='widen'){ go({folder:'',type:''}, false); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='/' && document.activeElement!==$('#q') && !/input|select|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if (e.key==='Escape'){ if (!$('#panel').hidden) closePanel(); else if ($('#tree').classList.contains('on')){ $('#tree').classList.remove('on'); $('#scrim').classList.remove('on'); } else if (document.activeElement===$('#q') && $('#q').value){ $('#clear').click(); } }
  if (e.key==='Enter' && e.target.classList && e.target.classList.contains('row')) openFile(e.target.dataset.id);
});
$('#sort').addEventListener('change', e=>go({sort:e.target.value}, false));
$('#more').addEventListener('click', ()=>{ S.shown += PAGE; render(); });
$('#pClose').addEventListener('click', closePanel);
$('#pOpen').addEventListener('click', ()=>{ current_file && track('open', fileInfo(current_file)); });
$('#pDown').addEventListener('click', ()=>{ current_file && track('download', fileInfo(current_file)); });
$('#scrim').addEventListener('click', ()=>{ closePanel(); $('#tree').classList.remove('on'); $('#scrim').classList.remove('on'); });
$('#openTree').addEventListener('click', ()=>{ $('#tree').classList.add('on'); $('#scrim').classList.add('on'); });
$('#pCopy').addEventListener('click', async e=>{
  const share = location.href;
  try{ await navigator.clipboard.writeText(share); toast('הקישור הועתק'); }catch(_){ toast('לא ניתן להעתיק — העתיקו מהכתובת למעלה'); }
});
$('#home').addEventListener('click', e=>{ e.preventDefault(); $('#q').value=''; $('#searchBox').classList.remove('has'); Object.assign(S,{q:'',folder:'',type:'',sort:'rel',shown:PAGE}); setHash({file:null}); renderTree(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
window.addEventListener('popstate', ()=>{ if(!DB) return; readHash(); renderTree(); render(); if (fileFromHash) openFile(fileFromHash); else if(!$('#panel').hidden){ $('#panel').classList.remove('on'); $('#scrim').classList.remove('on'); setTimeout(()=>{$('#panel').hidden=true; $('#pBody').innerHTML='';},320);} });
$('#theme').addEventListener('click', ()=>{
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try{ localStorage.setItem('rl-theme', r.dataset.theme); }catch(_){}
});
try{ const t = localStorage.getItem('rl-theme'); if (t) document.documentElement.dataset.theme = t; const v = localStorage.getItem('rl-view'); if (v) S.view = v; }catch(_){}
let tt; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }

/* ── local file fallback (opened from disk) ─────────── */
function showDrop(){
  $('#live').querySelector('.txt').textContent = 'אין נתונים';
  $('#content').innerHTML = `<div class="drop" id="drop"><b style="font:700 24px var(--serif);color:var(--ink);display:block;margin-bottom:8px">לא נמצאו נתונים</b>
    כשהאתר נפתח ישירות מהמחשב, הדפדפן חוסם את טעינת הנתונים. גררו לכאן את <b>data.json</b> או <label style="color:var(--teal);text-decoration:underline;cursor:pointer">בחרו קובץ<input type="file" accept=".json" hidden id="pick"></label>.</div>`;
  const d = $('#drop');
  const read = file => file.text().then(t=>{ const j=JSON.parse(t); if(!j.files) throw 0; restoreContent(j); }).catch(()=>toast('הקובץ אינו קובץ נתונים תקין'));
  d.addEventListener('dragover', e=>{e.preventDefault(); d.classList.add('over');});
  d.addEventListener('dragleave', ()=>d.classList.remove('over'));
  d.addEventListener('drop', e=>{e.preventDefault(); d.classList.remove('over'); e.dataTransfer.files[0] && read(e.dataTransfer.files[0]);});
  $('#pick').addEventListener('change', e=>e.target.files[0] && read(e.target.files[0]));
}
const CONTENT_HTML = document.getElementById('content').innerHTML;
function restoreContent(j){ $('#content').innerHTML = CONTENT_HTML; bindContent(); start(j,false); }
function bindContent(){
  $('#sort').addEventListener('change', e=>go({sort:e.target.value}, false));
  $('#more').addEventListener('click', ()=>{ S.shown += PAGE; render(); });
  $('#openTree').addEventListener('click', ()=>{ $('#tree').classList.add('on'); $('#scrim').classList.add('on'); });
}

load().then(()=>{
  if (!DB) return;
  let first = true; try{ first = !sessionStorage.getItem('rl-visit'); sessionStorage.setItem('rl-visit','1'); }catch(_){}
  if (first) track('visit');
  if (fileFromHash) openFile(fileFromHash);
});
</script>
</body>
</html>
