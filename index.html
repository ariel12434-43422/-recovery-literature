<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>מאגר ספרות החלמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Sans+Hebrew:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ground:#eef2ef;--ink:#16262c;--muted:#5d6f72;--teal:#0f4f4c;--amber:#d99a1c}
@media (prefers-color-scheme:dark){:root{--ground:#0f1719;--ink:#e3ece9;--muted:#9db0b0;--teal:#5bbcb2;--amber:#f0bd4f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:17px/1.7 "IBM Plex Sans Hebrew",system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;text-align:center}
.mark{display:inline-block;width:16px;height:30px;border-radius:2px;background:var(--teal);box-shadow:7px 4px 0 -1px var(--amber);margin-bottom:24px}
h1{font:900 clamp(32px,7vw,52px)/1.05 "Frank Ruhl Libre",Georgia,serif;margin:0 0 16px}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true"></span>
  <h1>מאגר ספרות החלמה</h1>
  <p>האתר סגור זמנית.</p>
</main>
</body>
</html>
